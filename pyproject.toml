[project]
name = "shade"
version = "0.1.0"
description = "Real-time call assistant for Windows: live transcription and instant AI hints"
readme = "README.md"
authors = [
    { name = "siberian", email = "siberian@sibprojects.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.7.0",
    "faster-whisper>=1.2.1",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.28.1.4",
    "nvidia-ml-py>=13.615.71",
    "onnxruntime>=1.31.1",
    "openai>=3.48.0",
    "pyaudiowpatch>=0.2.12.9",
    "pynput>=1.8.2",
    "pyside6>=6.12.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
shade = "shade:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
